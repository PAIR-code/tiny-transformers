<div class="computation-tree-container">
  <!-- Sample Selector Toolbar -->
  <div class="tree-header-bar">
    <div class="header-left">
      <span class="bar-title">Interactive Computation DAG</span>
      <span class="bar-formula"><markdown [inline]="true" [katex]="true" [data]="'$f(x_1, x_2) = b + w_1 x_1 + w_2 x_2 + w_3 x_1 x_2$'"></markdown></span>
    </div>

    <!-- Color Legend for Node Operations -->
    <div class="tree-legend-row">
      <span class="legend-chip chip-input"><span class="dot"></span> Input (xᵢ)</span>
      <span class="legend-chip chip-param"><span class="dot"></span> Parameter (b, wᵢ)</span>
      <span class="legend-chip chip-multiplication"><span class="dot"></span> Multiplication (·)</span>
      <span class="legend-chip chip-addition"><span class="dot"></span> Addition (∑)</span>
      <span class="legend-chip chip-loss"><span class="dot"></span> Loss</span>
    </div>

    <!-- Active Sample Selector Bar & Backprop Toggle -->
    <div class="tree-controls-group">
      <div class="sample-selector-bar">
        <span class="sample-prompt">Sample $(x_1, x_2)$:</span>
        <div class="sample-pill-group">
          <button
            mat-button
            class="sample-pill-btn"
            [class.active-sample]="activeSample()[0] === 0 && activeSample()[1] === 0"
            (click)="selectSample(0, 0)"
          >
            (0, 0)
          </button>
          <button
            mat-button
            class="sample-pill-btn"
            [class.active-sample]="activeSample()[0] === 0 && activeSample()[1] === 1"
            (click)="selectSample(0, 1)"
          >
            (0, 1)
          </button>
          <button
            mat-button
            class="sample-pill-btn"
            [class.active-sample]="activeSample()[0] === 1 && activeSample()[1] === 0"
            (click)="selectSample(1, 0)"
          >
            (1, 0)
          </button>
          <button
            mat-button
            class="sample-pill-btn"
            [class.active-sample]="activeSample()[0] === 1 && activeSample()[1] === 1"
            (click)="selectSample(1, 1)"
          >
            (1, 1)
          </button>
        </div>
      </div>

      <!-- Backprop Flow Toggle Button -->
      <button
        mat-stroked-button
        class="backprop-toggle-btn"
        [class.active-toggle]="showBackprop()"
        (click)="showBackprop.set(!showBackprop())"
        matTooltip="Show gradient backpropagation paths (◄ ∇) and parameter update targets for the active sample"
      >
        <mat-icon>alt_route</mat-icon>
        <span>{{ showBackprop() ? 'Gradient Flow: ON' : 'Gradient Flow: OFF' }}</span>
      </button>
    </div>
  </div>

  <!-- Main Tree SVG Area -->
  <div class="svg-viewport">
    <svg viewBox="0 0 980 590" class="tree-svg" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- Gradients -->
        <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.6" />
          <stop offset="100%" stop-color="#64748b" stop-opacity="0.9" />
        </linearGradient>

        <linearGradient id="backpropGradChanging" x1="100%" y1="0%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#e11d48" />
          <stop offset="100%" stop-color="#be185d" />
        </linearGradient>

        <linearGradient id="backpropGradUnchanging" x1="100%" y1="0%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#f472b6" stop-opacity="0.5" />
          <stop offset="100%" stop-color="#fda4af" stop-opacity="0.3" />
        </linearGradient>

        <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08" />
        </filter>

        <filter id="selectedGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#a855f7" flood-opacity="0.4" />
        </filter>
      </defs>

      <!-- Connecting Edges -->
      <g class="edges-layer">
        @for (edge of edges; track edge.id) {
          @let edgeState = getEdgeBackpropState(edge.id);
          <path
            [attr.d]="edge.pathD"
            class="tree-edge-line"
            [class.edge-selected]="selectedNodeId() === edge.from || selectedNodeId() === edge.to"
            [class.edge-backprop-changing]="edgeState === 'changing'"
            [class.edge-backprop-unchanging]="edgeState === 'unchanging'"
          />

          <!-- Backprop Gradient Marker on Active Edges -->
          @if (edgeState !== 'none') {
            <g
              class="backprop-marker-group"
              [class.marker-changing]="edgeState === 'changing'"
              [class.marker-unchanging]="edgeState === 'unchanging'"
              [attr.transform]="'translate(' + edge.badgeX + ',' + edge.badgeY + ')'"
            >
              <circle r="9" class="backprop-marker-bg" />
              <text y="3" text-anchor="middle" class="backprop-marker-arrow">◄</text>
            </g>
          }
        }
      </g>

      <!-- Tree Nodes with Embedded Interactive Berkovich Digit Displays -->
      <g class="nodes-layer">
        @for (node of nodes; track node.id) {
          <foreignObject
            [attr.x]="node.x - node.width/2"
            [attr.y]="node.y - node.height/2"
            [attr.width]="node.width"
            [attr.height]="node.height"
            class="tree-node-foreign"
          >
            <div
              xmlns="http://www.w3.org/1999/xhtml"
              class="tree-node-card"
              [class.node-selected]="selectedNodeId() === node.id"
              [class.node-input]="node.category === 'input'"
              [class.node-param]="node.category === 'param'"
              [class.node-multiplication]="node.category === 'multiplication'"
              [class.node-addition]="node.category === 'addition'"
              [class.node-loss]="node.category === 'loss'"
              (click)="selectNode(node.id)"
            >
              <!-- Top Node Header Line -->
              <div class="node-header-row">
                <span class="node-title-lbl">{{ node.label }}</span>
                <span class="node-cat-dot"></span>
              </div>

              <!-- Node Body: Digit Display or Loss Dual Display -->
              @if (node.id === 'target_loss') {
                <div class="node-loss-dual-wrapper">
                  @if (currentForward(); as fwd) {
                    <app-berkovich-dual-digit-display
                      [prime]="config().prime"
                      [xCenter]="fwd.f_out.center"
                      [xRho]="fwd.f_out.rho"
                      [yCenter]="targetRational()"
                      [yRho]="-2"
                      [digitsLeft]="config().digitsLeft"
                      [digitsRight]="config().digitsRight"
                      [scale]="0.65"
                      rhoLabelPosition="above-below"
                      [editable]="false"
                      [xEditableCenter]="false"
                      [xEditableRho]="false"
                      [yEditableCenter]="false"
                      [yEditableRho]="false"
                      xOuterBoxColor="#10b981"
                      yOuterBoxColor="#6366f1"
                    ></app-berkovich-dual-digit-display>
                    <div class="dual-loss-stats-row">
                      <span class="loss-pill">Loss: <strong>{{ fwd.loss | number:'1.3-3' }}</strong></span>
                      <span class="target-pill">Target: <strong>y={{ target() }}</strong></span>
                    </div>
                  }
                </div>
              } @else if (getNodeDisk(node.id); as disk) {
                @let gradDetails = getWeightGradientDetails($any(node.id));
                <div class="node-embedded-digits">
                  <app-berkovich-digit-display
                    [center]="disk.center"
                    [rho]="disk.rho"
                    [prime]="config().prime"
                    [digitsLeft]="config().digitsLeft"
                    [digitsRight]="config().digitsRight"
                    [scale]="0.75"
                    rhoLabelPosition="above"
                    [editableCenter]="isParamNode(node.id) || isInputNode(node.id)"
                    [editableRho]="isParamNode(node.id)"
                    [showUpdatedLocation]="isParamNode(node.id) && showBackprop() && gradDetails.active"
                    [updatedCenter]="isParamNode(node.id) ? gradDetails.nextCenter : undefined"
                    [updatedRho]="isParamNode(node.id) ? gradDetails.nextRho : undefined"
                    [updatedLineColor]="gradDetails.willChange ? '#e11d48' : '#f472b6'"
                    [updatedLineStyle]="gradDetails.willChange ? 'dashed' : 'dotted'"
                    (centerChange)="onNodeCenterChange(node.id, $event)"
                    (rhoChange)="onNodeRhoChange(node.id, $event)"
                  ></app-berkovich-digit-display>
                </div>
              }
            </div>
          </foreignObject>
        }
      </g>
    </svg>
  </div>
</div>
