<div class="berkovich-page-container">
  <app-berkovich-header
    title="Berkovich Extended Monna Mapping & 2-adic Encoding"
    subtitle="Encoding continuous real values $x \in [0, 1]$ into $p$-adic tree nodes ($\mathbb{R} \to \mathbb{Q}_p$) and decoding $p$-adic digits back to regularized real intervals ($\mathbb{Q}_p \to \mathbb{R}$)."
  ></app-berkovich-header>

  <div class="encoding-layout-single">
    <!-- Main Card: Berkovich Extended Monna Mapping -->
    <div class="card main-mapping-card">
      <div class="card-header">
        <div class="header-titles">
          <h3>Berkovich Extended Monna Mapping</h3>
          <span class="subtitle">2-adic Tree Traversal Map &amp; 1D Sub-Interval Halving</span>
        </div>

        <div class="header-actions">
          <label class="checkbox-label">
            <input
              type="checkbox"
              [checked]="useRhoNormalization()"
              (change)="setUseRhoNormalization($any($event.target).checked)"
            />
            <span class="checkbox-text">use rho normalization</span>
          </label>

          <div class="precision-depth-controls">
            <label for="depth-select">Depth (K):</label>
            <select
              id="depth-select"
              [value]="depth()"
              (change)="onDepthChange(+$any($event.target).value)"
            >
              <option [value]="1">K = 1 (2 Digits)</option>
              <option [value]="2">K = 2 (4 Digits, Std)</option>
              <option [value]="3">K = 3 (6 Digits)</option>
              <option [value]="4">K = 4 (8 Digits)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Presets & Drag Instruction Bar -->
      <div class="presets-toolbar">
        <div class="presets-row">
          <span class="preset-label">Quick Presets:</span>
          <div class="preset-buttons">
            @for (preset of presets; track preset.label) {
              <button
                mat-stroked-button
                [class.active-preset]="Math.abs(realTarget() - preset.value) < 1e-4"
                (click)="setRealTarget(preset.value)"
              >
                {{ preset.label }}
              </button>
            }
          </div>
        </div>

        <div class="drag-hint">
          <mat-icon>touch_app</mat-icon>
          <span>Drag <strong class="exact-hint">x_exact</strong> pin or click number line. Click digits or &rho; to edit:</span>
        </div>
      </div>

      <!-- D3 2-adic Tree Traversal Map & Movable Blue-Outlined Digit Display -->
      <app-berkovich-encoding-tree-vis
        [steps]="steps()"
        [targetValue]="realTarget()"
        [biasedValue]="decodedBiasedReal()"
        [currentRationalCenter]="currentRationalCenter()"
        [depth]="depth()"
        [prime]="prime()"
        [useRhoNormalization]="useRhoNormalization()"
        [padicRho]="padicRho()"
        (targetChange)="setRealTarget($event)"
        (centerChange)="onDigitDisplayCenterChange($event)"
        (rhoChange)="onDigitDisplayRhoChange($event)"
      ></app-berkovich-encoding-tree-vis>
    </div>

    <!-- Mathematical Explainer Card -->
    <div class="card explanation-card">
      <h3>Reverse Decoding &amp; Berkovich Disk Regularization</h3>
      <markdown [data]="reverseExplanationMarkdown" [katex]="true"></markdown>
    </div>
  </div>
</div>
